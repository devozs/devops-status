services:
  postgres:
    image: postgres:16-alpine
    container_name: devops-status-db
    environment:
      POSTGRES_DB: devops_status
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops_local
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d devops_status"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
