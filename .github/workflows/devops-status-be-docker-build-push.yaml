name: CI - DevOps Status Backend

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    tags-ignore:
      - 'release/*'
    paths:
      - 'devops-status-be/**'
      - '.github/workflows/devops-status-be-docker-build-push.yaml'

permissions:
  contents: read
  packages: write

jobs:
  docker:
    env:
      REGISTRY: ghcr.io/devozs
      IMAGE: devops-status-management
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        id: prep
        run: |
          BRANCH=${GITHUB_REF##*/}
          TS=$(date +%s)
          REVISION=${GITHUB_SHA::8}
          BUILD_ID="${BRANCH}-${REVISION}-${TS}"
          LATEST_ID=canary
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            BUILD_ID=${GITHUB_REF#refs/tags/}
            LATEST_ID=latest
          fi
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "BUILD_ID=${BUILD_ID}" >> "$GITHUB_OUTPUT"
          echo "LATEST_ID=${LATEST_ID}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        run: |
          docker build -f devops-status-be/Dockerfile -t devops-status-be:build .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker push
        run: |
          docker tag devops-status-be:build ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.prep.outputs.BUILD_ID }}
          docker tag devops-status-be:build ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.prep.outputs.LATEST_ID }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.prep.outputs.BUILD_ID }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.prep.outputs.LATEST_ID }}

      - name: Prune old GHCR images (keep last 3)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: devozs
          PACKAGE: ${{ env.IMAGE }}
        run: |
          echo "Fetching versions for ghcr.io/${OWNER}/${PACKAGE}"
          versions=$(gh api -H "Accept: application/vnd.github+json" \
            /users/${OWNER}/packages/container/${PACKAGE}/versions \
            --paginate -q '.[].id')
          keep=3
          count=0
          for id in $versions; do
            count=$((count+1))
            if [ $count -le $keep ]; then
              continue
            fi
            echo "Deleting older version id ${id}"
            gh api --method DELETE -H "Accept: application/vnd.github+json" \
              /users/${OWNER}/packages/container/${PACKAGE}/versions/${id} || true
          done
