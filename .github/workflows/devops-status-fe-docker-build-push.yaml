name: CI - DevOps Status Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging
    paths:
      - 'devops-status-fe/**'
      - '.github/workflows/devops-status-fe-docker-build-push.yaml'

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    env:
      REGISTRY: ghcr.io/devozs
      IMAGE: devops-status-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate build ID
        id: prep
        run: |
          branch=${GITHUB_REF##*/}
          sha=${GITHUB_SHA::8}
          ts=$(date +%s)
          build_id="${branch}-${sha}-${ts}"
          if [[ "$branch" == "staging" ]]; then
            semver_tag="rc"
            build_id="${build_id}-${semver_tag}"
          fi
          echo "BUILD_ID=${build_id}" >> "$GITHUB_ENV"
          echo "BUILD_ID=${build_id}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        run: |
          docker build -f devops-status-fe/Dockerfile -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.BUILD_ID }} .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker push
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.BUILD_ID }}

      - name: Prune old GHCR images (keep last 3)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: devozs
          PACKAGE: ${{ env.IMAGE }}
        run: |
          echo "Fetching versions for ghcr.io/${OWNER}/${PACKAGE}"
          versions=$(gh api -H "Accept: application/vnd.github+json" \
            /users/${OWNER}/packages/container/${PACKAGE}/versions \
            --paginate -q '.[].id')
          keep=3
          count=0
          for id in $versions; do
            count=$((count+1))
            if [ $count -le $keep ]; then
              continue
            fi
            echo "Deleting older version id ${id}"
            gh api --method DELETE -H "Accept: application/vnd.github+json" \
              /users/${OWNER}/packages/container/${PACKAGE}/versions/${id} || true
          done
